name: Finalize App Release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: CI run ID promoted by Start App Release.
        required: true
        type: string
      default_post_release_phase:
        description: Phase after a successful stable release.
        required: false
        default: pre
        type: choice
        options: [pre, rc, rtm]

concurrency:
  group: release-state
  cancel-in-progress: false
  queue: max

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      version: ${{ steps.context.outputs.version }}
      ci_run_id: ${{ steps.context.outputs.ci_run_id }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      default_phase: ${{ steps.context.outputs.default_phase }}
      state_json: ${{ steps.context.outputs.state_json }}
      release_exists: ${{ steps.context.outputs.release_exists }}
      state_needs_advance: ${{ steps.context.outputs.state_needs_advance }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Validate tagged release context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref_type }}' = tag ||
            { echo "::error::Finalize App Release must run from an approved v* tag."; exit 1; }
          TAG='${{ github.ref_name }}'
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]] ||
            { echo "::error::Invalid release tag '${TAG}'."; exit 1; }
          VERSION="${TAG#v}"
          CI_RUN_ID='${{ inputs.ci_run_id }}'
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::Invalid CI run ID."; exit 1; }

          RUN_JSON=$(gh api "repos/${{ github.repository }}/actions/runs/${CI_RUN_ID}")
          test "$(jq -r '.name' <<< "$RUN_JSON")" = CI ||
            { echo "::error::Run ${CI_RUN_ID} is not CI."; exit 1; }
          test "$(jq -r '.path' <<< "$RUN_JSON")" = '.github/workflows/ci.yml' ||
            { echo "::error::Run ${CI_RUN_ID} used the wrong workflow path."; exit 1; }
          test "$(jq -r '.status' <<< "$RUN_JSON")" = completed ||
            { echo "::error::Run ${CI_RUN_ID} is not complete."; exit 1; }
          test "$(jq -r '.conclusion' <<< "$RUN_JSON")" = success ||
            { echo "::error::Run ${CI_RUN_ID} did not succeed."; exit 1; }
          RUN_EVENT=$(jq -r '.event' <<< "$RUN_JSON")
          [[ "$RUN_EVENT" == push || "$RUN_EVENT" == workflow_dispatch ]] ||
            { echo "::error::Run ${CI_RUN_ID} was not triggered by a main push or manual dispatch."; exit 1; }
          test "$(jq -r '.head_branch' <<< "$RUN_JSON")" = main ||
            { echo "::error::Run ${CI_RUN_ID} is not from main."; exit 1; }
          test "$(jq -r '.head_repository.full_name' <<< "$RUN_JSON")" = '${{ github.repository }}' ||
            { echo "::error::Run ${CI_RUN_ID} is from another repository."; exit 1; }
          CI_HEAD_SHA=$(jq -r '.head_sha' <<< "$RUN_JSON")
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          test "$TAG_SHA" = "$CI_HEAD_SHA" ||
            { echo "::error::Tag ${TAG} points to ${TAG_SHA}, but CI run ${CI_RUN_ID} built ${CI_HEAD_SHA}."; exit 1; }

          RELEASE_EXISTS=false
          if gh api "repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>"$RUNNER_TEMP/release-query.err"; then
            RELEASE_EXISTS=true
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-query.err"; then
            cat "$RUNNER_TEMP/release-query.err" >&2
            exit 1
          fi

          RELEASE_STATE_REF=$(git ls-remote --heads origin refs/heads/release-state)
          if [ -n "$RELEASE_STATE_REF" ]; then
            git fetch origin refs/heads/release-state:refs/remotes/origin/release-state
            STATE_JSON=$(git show refs/remotes/origin/release-state:version-state.json)
          else
            RELEASES_JSON=$(gh release list --repo '${{ github.repository }}' --json tagName,isDraft,isPrerelease --limit 1000)
            STATE_JSON=$(dotnet scripts/version.cs state --releases-json "$RELEASES_JSON")
          fi
          EXPECTED_VERSION=$(dotnet scripts/version.cs calculate --state "$STATE_JSON" | jq -r '.rcVersion')
          STATE_NEEDS_ADVANCE=true
          if [ "$VERSION" != "$EXPECTED_VERSION" ]; then
            if [ "$RELEASE_EXISTS" != true ]; then
              echo "::error::Tag version ${VERSION} does not match current promotable version ${EXPECTED_VERSION}."
              exit 1
            fi
            STATE_NEEDS_ADVANCE=false
          fi

          DEFAULT_PHASE='${{ inputs.default_post_release_phase }}'
          [[ "$DEFAULT_PHASE" =~ ^(pre|rc|rtm)$ ]] ||
            { echo "::error::Invalid post-release phase '${DEFAULT_PHASE}'."; exit 1; }
          if [[ "$VERSION" == *-* ]]; then IS_PRERELEASE=true; else IS_PRERELEASE=false; fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=${CI_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "default_phase=${DEFAULT_PHASE}" >> "$GITHUB_OUTPUT"
          echo "state_json=$(jq -c . <<< "$STATE_JSON")" >> "$GITHUB_OUTPUT"
          echo "release_exists=${RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "state_needs_advance=${STATE_NEEDS_ADVANCE}" >> "$GITHUB_OUTPUT"

      - name: Download promotable bundle
        if: steps.context.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./artifacts
          gh run download '${{ steps.context.outputs.ci_run_id }}' \
            --repo '${{ github.repository }}' \
            --name native-promotable-bundle \
            --dir ./artifacts

      - name: Verify release bundle
        if: steps.context.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          METADATA=./artifacts/release-metadata.json
          test -f "$METADATA" || { echo "::error::Missing release-metadata.json."; exit 1; }
          test "$(jq -r '.version' "$METADATA")" = '${{ steps.context.outputs.version }}' ||
            { echo "::error::Release metadata version mismatch."; exit 1; }
          test "$(jq -r '.sourceCommit' "$METADATA")" = "$(git rev-list -n 1 '${{ github.ref_name }}')" ||
            { echo "::error::Release metadata source commit mismatch."; exit 1; }
          test "$(jq -r '.windowsSigned' "$METADATA")" = false ||
            { echo "::error::Promotable release metadata must identify unsigned Windows assets."; exit 1; }
          test "$(jq '[.assets[].runtimeIdentifier] | length > 0 and length == (unique | length)' "$METADATA")" = true ||
            { echo "::error::Release metadata runtime inventory is empty or duplicated."; exit 1; }
          if command -v sha256sum >/dev/null 2>&1; then
            (cd ./artifacts && sha256sum --check checksums.txt)
          else
            (cd ./artifacts && shasum -a 256 --check checksums.txt)
          fi
          METADATA_ASSETS=$(jq -r '.assets[].name' "$METADATA" | sort)
          CHECKSUM_ASSETS=$(awk '{print $2}' ./artifacts/checksums.txt | sed 's/^\*//' | sort)
          test "$METADATA_ASSETS" = "$CHECKSUM_ASSETS" ||
            { echo "::error::Release metadata and checksum inventories differ."; exit 1; }

      - name: Upload unsigned release bundle
        if: steps.context.outputs.release_exists != 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-unsigned-bundle
          path: ./artifacts/*
          retention-days: 7

  sign-windows:
    runs-on: windows-2022
    needs: [prepare-release]
    if: needs.prepare-release.outputs.release_exists != 'true'
    environment: production
    outputs:
      windows_signed: ${{ steps.signing-config.outputs.enabled }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Download unsigned release bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-unsigned-bundle
          path: ./artifacts/bundle

      - name: Expand Windows release assets
        shell: pwsh
        run: dotnet ./scripts/expand-windows-release-assets.cs -- --bundle-directory './artifacts/bundle' --working-directory './artifacts/windows-assets'

      - name: Detect signing configuration
        id: signing-config
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $required = 'AZURE_CLIENT_ID','AZURE_TENANT_ID','AZURE_SUBSCRIPTION_ID','AZURE_SIGNING_ENDPOINT','AZURE_SIGNING_ACCOUNT','AZURE_CERT_PROFILE'
          $configured = @($required | Where-Object { -not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
          if ($configured.Count -eq 0) {
            "enabled=false" >> $env:GITHUB_OUTPUT
            Write-Warning 'Azure signing is not configured; publishing unsigned Windows payloads with portable attestations.'
          } elseif ($configured.Count -ne $required.Count) {
            $missing = @($required | Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) })
            throw "Azure signing is partially configured. Missing secret(s): $($missing -join ', ')."
          } else {
            "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Azure login
        if: steps.signing-config.outputs.enabled == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign all Windows executable payloads
        if: steps.signing-config.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\artifacts\windows-assets
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify all signed Windows payloads
        if: steps.signing-config.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $payloadRoots = @(Get-ChildItem './artifacts/windows-assets' -Directory)
          if ($payloadRoots.Count -eq 0) { throw 'No expanded Windows payload directories were found.' }
          foreach ($payloadRoot in $payloadRoots) {
            $manifest = Get-Content (Join-Path $payloadRoot.FullName 'payload-manifest.json') -Raw | ConvertFrom-Json
            $binaryPaths = @($manifest.files |
              Where-Object { $_ -match '\.(exe|dll)$' } |
              ForEach-Object { Join-Path $payloadRoot.FullName $_ })
            if ($binaryPaths.Count -eq 0) { throw "Payload '$($payloadRoot.Name)' has no executable files." }
            foreach ($binaryPath in $binaryPaths) {
              ./scripts/Verify-WindowsBinaryIssuer.ps1 -BinaryPath $binaryPath -InstallerScriptPath './scripts/install/install-templatecli.ps1'
            }
          }

      - name: Repack Windows assets
        shell: pwsh
        run: dotnet ./scripts/compress-windows-release-assets.cs -- --working-directory './artifacts/windows-assets' --output-directory './artifacts/signed-windows-assets'

      - name: Upload Windows assets
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: release-signed-windows-assets
          path: ./artifacts/signed-windows-assets/*
          retention-days: 7

  publish-release:
    runs-on: ubuntu-latest
    needs: [prepare-release, sign-windows]
    if: ${{ always() && needs.prepare-release.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Download unsigned release bundle
        if: needs.prepare-release.outputs.release_exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-unsigned-bundle
          path: ./artifacts/release

      - name: Download Windows assets
        if: needs.prepare-release.outputs.release_exists != 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-signed-windows-assets
          path: ./artifacts/signed-windows-assets

      - name: Overlay Windows assets and regenerate metadata
        if: needs.prepare-release.outputs.release_exists != 'true'
        shell: pwsh
        run: |
          Copy-Item './artifacts/signed-windows-assets/*' './artifacts/release' -Force
          dotnet ./scripts/update-release-bundle-metadata.cs -- --bundle-directory './artifacts/release' --windows-signed '${{ needs.sign-windows.outputs.windows_signed }}'

      - name: Verify final bundle
        if: needs.prepare-release.outputs.release_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.version' ./artifacts/release/release-metadata.json)" = '${{ needs.prepare-release.outputs.version }}'
          test "$(jq -r '.sourceCommit' ./artifacts/release/release-metadata.json)" = "$(git rev-list -n 1 '${{ github.ref_name }}')"
          test "$(jq -r '.windowsSigned' ./artifacts/release/release-metadata.json)" = '${{ needs.sign-windows.outputs.windows_signed }}'
          if command -v sha256sum >/dev/null 2>&1; then
            (cd ./artifacts/release && sha256sum --check checksums.txt)
          else
            (cd ./artifacts/release && shasum -a 256 --check checksums.txt)
          fi

      - name: Attest final release archives
        id: attest
        if: needs.prepare-release.outputs.release_exists != 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26
        with:
          subject-path: |
            ./artifacts/release/templatecli-*.zip
            ./artifacts/release/templatecli-*.tar.gz

      - name: Stage portable attestation bundle
        if: needs.prepare-release.outputs.release_exists != 'true'
        shell: bash
        run: cp '${{ steps.attest.outputs.bundle-path }}' ./artifacts/release/attestations.jsonl

      - name: Create immutable GitHub release
        if: needs.prepare-release.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          if gh api "repos/${{ github.repository }}/releases/tags/${TAG}" >/dev/null 2>"$RUNNER_TEMP/release-query.err"; then
            echo "::error::Release ${TAG} already exists; refusing to delete or recreate it."
            exit 1
          elif ! grep -q 'HTTP 404' "$RUNNER_TEMP/release-query.err"; then
            cat "$RUNNER_TEMP/release-query.err" >&2
            exit 1
          fi
          EXTRA_ARGS=()
          if [ '${{ needs.prepare-release.outputs.is_prerelease }}' = true ]; then
            EXTRA_ARGS+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" \
            --repo '${{ github.repository }}' \
            "${EXTRA_ARGS[@]}" \
            --title "$TAG" \
            --generate-notes \
            ./artifacts/release/*

      - name: Verify existing release before recovery
        if: needs.prepare-release.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='${{ github.ref_name }}'
          mkdir -p ./artifacts/existing-release
          gh release download "$TAG" --repo '${{ github.repository }}' --dir ./artifacts/existing-release
          METADATA=./artifacts/existing-release/release-metadata.json
          test "$(jq -r '.version' "$METADATA")" = '${{ needs.prepare-release.outputs.version }}'
          test "$(jq -r '.sourceCommit' "$METADATA")" = "$(git rev-list -n 1 "$TAG")"
          test "$(jq -r '.windowsSigned | type' "$METADATA")" = boolean
          test -s ./artifacts/existing-release/attestations.jsonl
          if command -v sha256sum >/dev/null 2>&1; then
            (cd ./artifacts/existing-release && sha256sum --check checksums.txt)
          else
            (cd ./artifacts/existing-release && shasum -a 256 --check checksums.txt)
          fi

      - name: Advance release state
        if: needs.prepare-release.outputs.state_needs_advance == 'true'
        shell: bash
        run: |
          set -euo pipefail
          NEW_STATE_JSON=$(dotnet scripts/version.cs advance \
            --state '${{ needs.prepare-release.outputs.state_json }}' \
            --shipped-version '${{ needs.prepare-release.outputs.version }}' \
            --default-phase '${{ needs.prepare-release.outputs.default_phase }}')
          mkdir -p ./artifacts/release-state
          printf '%s\n' "$NEW_STATE_JSON" > ./artifacts/release-state/version-state.json
          bash ./scripts/publish-branch-content.sh release-state ./artifacts/release-state "Advance release state after ${{ needs.prepare-release.outputs.version }}"
